<style>
:root{
  --bg:#f7f3ea; --panel:#fffdf8; --card:#ffffff; --text:#463f37; --muted:#7d7469; --border:#d9d0c3;
  --accent:#8a9a68; --accent2:#d8c1a2; --soil:#b8875c; --soil2:#9e6f49; --wet:#94684a; --wet2:#7b5538; --red:#c8322d;
  --tok:46px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:linear-gradient(#fbf8f0,#f2eadf);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
/* iPhone向け：ダブルタップで拡大しない、長押しで文字選択やメニューが出ない（セーブの文字だけは選べる） */
button,.plot,.actor,.scroller{touch-action:manipulation}
.game{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.xfer textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit}
.game{position:relative;width:min(980px,100%);margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:clamp(17px,4.4vw,24px);margin:0;line-height:1.3}
.ver{font-size:12px;color:var(--muted)}
.headR{display:inline-flex;align-items:center;gap:8px}
/* 音のボタン（右上）。off＝音なし */
.sndBtn{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--border);background:#fff;color:#7d8f5b;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sndBtn svg{width:20px;height:20px;display:block}
.sndBtn .slash,.sndBtn .note{display:none}
.sndBtn.all .note{display:inline}
.sndBtn.all .w2{display:none}
.sndBtn.off{color:#b8ae9f}
.sndBtn.off .waves{display:none}
.sndBtn.off .slash{display:inline}

/* 上の情報バー */
.game[data-season="0"]{--seasonBg:#fde8ee;--seasonLine:#f3b7c6;--seasonInk:#d9607f}
.game[data-season="1"]{--seasonBg:#e1f3fb;--seasonLine:#9fd3f2;--seasonInk:#2f8fc4}
.game[data-season="2"]{--seasonBg:#fbe9d6;--seasonLine:#e9b48a;--seasonInk:#c9573a}
.game[data-season="3"]{--seasonBg:#eef2f6;--seasonLine:#c3ccd6;--seasonInk:#5f7f9c}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:10px 0 6px}
.chip.season{background:var(--seasonBg);border-color:var(--seasonLine);gap:6px}
.chip.season svg{width:26px;height:26px}
.chip.season b{font-size:20px;line-height:1;color:var(--seasonInk)}
.yearbar{display:flex;gap:5px;margin:0 0 8px}
.reqbar{display:none;align-items:center;gap:6px;margin:-2px 0 8px;padding:5px 10px;border-radius:12px;background:#fff;border:1px dashed var(--border);font-size:13px;color:var(--muted)}
.reqbar.on{display:flex}
.reqbar svg{width:20px;height:20px;flex:none}
.reqbar b{color:var(--text)}
.yb{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:10px;padding:5px 2px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.55);border:1px solid transparent}
.yb b{font-weight:700}
.yb i{width:7px;height:7px;border-radius:50%;background:#e2dacb;flex:none}
.yb i.past{background:#b9ae9c}
.yb.cur{background:var(--seasonBg);border-color:var(--seasonLine);color:var(--seasonInk)}
.yb.cur i.now{background:var(--seasonInk);transform:scale(1.4)}
.chip{
  border:1px solid var(--border);background:var(--card);border-radius:14px;padding:8px 12px;
  display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px;
}
.chip svg{width:20px;height:20px;flex:none}
.chip.clock{flex:1 1 150px;min-width:150px}
.dayline{position:relative;flex:1;height:6px;border-radius:3px;background:#ece4d6;min-width:40px}
.dayline i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#f0c36a;width:0}
.chip.goal{flex:1 1 100%;justify-content:space-between;font-size:13px;color:var(--muted)}
.chip.goal strong{color:var(--text);font-size:15px}

/* 景色（横スクロール） */
.vp{position:relative;height:440px;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--sky2)}
.vp[data-season="0"]{--sky1:#cfe8f5;--sky2:#f1f8ee;--mt1:#b5cdc0;--mt2:#97b8a5;--tree:#8dbf6f;--tree2:#f3b7c6;--grass:#bfdb93;--grass2:#a9cb7c;--fl1:#f29cb0;--fl2:#f6d365;--cap:0;--sun:0;--dots:.95;--dot1:#f6a9bd;--dot2:#ffffff;--dot3:#f6d365}
.vp[data-season="1"]{--sky1:#9fd3f2;--sky2:#e6f5fb;--mt1:#93b9aa;--mt2:#73a18e;--tree:#5f9a4a;--tree2:#4f8a43;--grass:#a3d06e;--grass2:#8cc05a;--fl1:#f4b942;--fl2:#ffffff;--cap:0;--sun:1;--dots:.4;--dot1:#ffffff;--dot2:#e9f5c9;--dot3:#ffffff}
.vp[data-season="2"]{--sky1:#d9e6ef;--sky2:#f7f0e3;--mt1:#c0ab94;--mt2:#a68a70;--tree:#dd9440;--tree2:#c9573a;--grass:#cdc67f;--grass2:#b8b068;--fl1:#c9573a;--fl2:#e9a24b;--cap:0;--sun:0;--dots:.9;--dot1:#d9773a;--dot2:#c9573a;--dot3:#e9b04b}
.vp[data-season="3"]{--sky1:#d3dde7;--sky2:#f2f5f8;--mt1:#c6cfd9;--mt2:#aab6c3;--tree:#9fada5;--tree2:#eef2f5;--grass:#e6ede4;--grass2:#d4ded3;--fl1:#ffffff;--fl2:#c9d6e2;--cap:1;--sun:0;--dots:0;--dot1:#fff;--dot2:#fff;--dot3:#fff}
.sky{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(var(--sky1) 0,var(--sky2) 32%);transition:background .6s}
.sun{position:absolute;right:58px;top:26px;width:42px;height:42px;border-radius:50%;background:#ffd76a;box-shadow:0 0 0 9px rgba(255,215,106,.28);opacity:var(--sun);transition:opacity .6s}
.nyudo{position:absolute;left:54%;top:52px;width:160px;height:96px;opacity:var(--sun);transition:opacity .6s;
  background:radial-gradient(circle at 28% 66%,#fff 0 27px,transparent 28px),radial-gradient(circle at 52% 40%,#fff 0 36px,transparent 37px),radial-gradient(circle at 76% 64%,#fff 0 28px,transparent 29px),radial-gradient(circle at 50% 84%,#fff 0 34px,transparent 35px)}
.vp.raining .sun,.vp.raining .nyudo{opacity:0}
.cloud{position:absolute;height:18px;border-radius:12px;background:#fff;opacity:.8}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46%;height:170%;left:14%;top:-80%}
.cloud::after{width:36%;height:130%;left:50%;top:-50%}
.scroller{position:absolute;left:0;top:0;right:0;bottom:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.scroller::-webkit-scrollbar{display:none}
.world{position:relative;width:1320px;height:440px;overflow:hidden}
.far{position:absolute;left:0;top:0;width:1320px;height:150px;will-change:transform}
.far svg{display:block;width:100%;height:100%}
.ground{position:absolute;left:0;right:0;top:140px;bottom:0;background:linear-gradient(var(--grass),var(--grass2));transition:background .6s}
.groundFx{position:absolute;left:0;right:0;top:172px;bottom:0;pointer-events:none;opacity:var(--dots);transition:opacity .6s;
  background-image:radial-gradient(circle 2.3px at 14px 18px,var(--dot1) 98%,transparent),radial-gradient(circle 1.9px at 60px 44px,var(--dot2) 98%,transparent),radial-gradient(circle 2.1px at 96px 12px,var(--dot3) 98%,transparent);
  background-size:118px 62px,92px 70px,142px 58px}
.path{position:absolute;background:#e3d2b4;opacity:.75;border-radius:12px}
.signpost{position:absolute;left:276px;top:170px;width:30px;height:46px;pointer-events:none;z-index:8}
.signpost::before{content:"";position:absolute;left:13px;top:24px;width:4px;height:22px;background:#8f6a44;border-radius:2px}
.signpost span{position:absolute;left:0;top:0;width:30px;height:28px;border-radius:6px;background:var(--seasonBg,#fff);border:2px solid #a87c4e;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--seasonInk,#463f37)}
.deco{position:absolute;display:block;overflow:visible;pointer-events:none}
.deco.locked{display:none}
.deco.pop{animation:popIn .5s ease-out}
.benchBtn{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:12px}
.benchBtn.locked{display:none}
.mat{position:absolute;border-radius:10px;background:var(--accent2);border:1px dashed #b89a78}
.basketBack,.basketFront{position:absolute;display:block;overflow:visible;pointer-events:none}
.basketBack{z-index:5}
.basketItems{position:absolute;left:268px;top:212px;width:44px;height:40px;z-index:6;pointer-events:none}
.basketItems svg{position:absolute;width:20px;height:20px}
.stones{position:absolute;left:40px;top:238px;width:92px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;z-index:9;border-radius:10px}
.stones.none{display:none}
.stones svg{position:absolute;width:18px;height:18px}
.frogsBox svg{position:absolute;width:22px;height:22px;z-index:9}
.seedDot{position:absolute;width:9px;height:6px;border-radius:50%;background:#6e4a2e;z-index:9;display:none}
.seedDot.on{display:block}
.basketFront{z-index:40;transform-origin:50% 100%}
.basketFront.bump{animation:bump .32s ease-out}

/* 畑のマス */
.plot{
  position:absolute;appearance:none;padding:0;margin:0;
  border:1px solid #a88461;border-radius:14px;
  background:linear-gradient(145deg,var(--soil),var(--soil2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#fff;cursor:pointer;z-index:10;
}
.plot.hidden{display:none}
.plot.wet{background:linear-gradient(145deg,var(--wet),var(--wet2))}
.plot.grass{background:linear-gradient(145deg,#9cc36b,#86b158);border:1px dashed #6f9a4a}
@supports (background:color-mix(in srgb,red,blue)){.plot.grass{background:linear-gradient(145deg,color-mix(in srgb,var(--grass2) 78%,#55803a),color-mix(in srgb,var(--grass2) 62%,#55803a));border-color:color-mix(in srgb,var(--grass2) 45%,#3f6a2a)}}
.plot.soggy::after{content:"";position:absolute;left:9%;right:9%;bottom:7%;height:24%;border-radius:50%;background:rgba(150,200,232,.6)}
.plot .crop{width:36px;height:36px;display:block;transition:transform .2s}
.plot.small .crop{width:34px;height:34px}
.plot.thirsty .crop{transform:rotate(-8deg) scale(.95);filter:saturate(.7)}
.plot.ripe .crop{animation:ripe 1.8s ease-in-out infinite}
.pill{font-size:10px;line-height:1;white-space:nowrap;letter-spacing:-.03em;padding:3px 4px;border-radius:8px;position:relative;z-index:1}
.pill.water{background:#e4f2fb;color:#2d6a94}
.pill.ripe{background:#fdf0c4;color:#7a5a12}
.pill.till{background:#f3f8e6;color:#4d6b2c}
.pill.pest{background:#fde6e1;color:#9a3f33}
.pill.frost{background:#eef5fa;color:#3f6a86}
/* 冬の朝の霜：土が白くこおる。野菜は傷まない */
.plot.frost{background:linear-gradient(145deg,#dbe7ef,#b7cbd9);border-color:#9fb6c6}
.plot.frost::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:13px;opacity:.95;pointer-events:none;
  background-image:radial-gradient(circle 1.7px at 12px 14px,#fff 98%,transparent),radial-gradient(circle 1.3px at 22px 9px,#fff 98%,transparent),radial-gradient(circle 1.5px at 8px 27px,#fff 98%,transparent);
  background-size:31px 29px,37px 33px,43px 41px}
.plot.frost .crop{filter:saturate(.65) brightness(1.06)}
.plot .frog{position:absolute;left:1px;bottom:1px;width:28px;height:28px;z-index:2}
.plot .bug{position:absolute;right:4px;top:18px;width:20px;height:20px;z-index:2;animation:wiggle .5s ease-in-out infinite}
.plot.poke{animation:poke .32s ease-out}
.plot.queued{outline:2px dashed rgba(255,255,255,.85);outline-offset:-6px}
.plot:focus-visible,.btn:focus-visible,.seed:focus-visible,.benchBtn:focus-visible,.actor.shada:focus-visible{outline:3px solid rgba(138,154,104,.5);outline-offset:2px}
.shadaPlot{border-radius:50%;border:1px dashed #8a6a48}

/* 顔だけキャラ */
.actors{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:30}
.actor{
  position:absolute;left:0;top:0;width:var(--tok);height:var(--tok);
  margin:calc(var(--tok)/-2) 0 0 calc(var(--tok)/-2);
  transition:transform 0ms linear;will-change:transform;
}
.actor.shada{pointer-events:auto;cursor:pointer;border-radius:50%}
#actors .actor.homare{display:none}
#actors .actor.homare.on{display:block;animation:fadeIn .4s ease-out}
.actor .shadow{position:absolute;left:16%;right:16%;bottom:-5%;height:15%;border-radius:50%;background:rgba(60,44,24,.25)}
.actor .bob{position:absolute;left:0;top:0;right:0;bottom:0;transform-origin:50% 92%}
.face{display:block;width:100%;height:100%;overflow:visible}
.face .happy,.face .sleepy,.face .scared,.face .smile{display:none}
[data-mood="happy"] .face .normal{display:none}
[data-mood="happy"] .face .happy{display:inline}
/* えりちゃんの帽子：畑に出るときだけ（夏＝小さな麦わら帽子、冬＝小さなニット帽）。おうちの中や、にっきの顔にはかぶせない */
.face .hat{display:none}
#game[data-season="1"] #actors .actor.eri .hat-summer,#game[data-season="3"] #actors .actor.eri .hat-winter{display:inline}
#game[data-season="1"] #actors .actor.eri .bubble,#game[data-season="3"] #actors .actor.eri .bubble{bottom:122%}
/* にっこり（smile）は、えりちゃんだけの表情。目を細めて、口は閉じたまま大きく笑う */
[data-face="eri"][data-mood="smile"] .face .normal{display:none}
[data-face="eri"][data-mood="smile"] .face .smile{display:inline}
[data-mood="sleepy"] .face .normal,[data-mood="sleepy"] .face .awake{display:none}
[data-mood="sleepy"] .face .sleepy{display:inline}
[data-mood="scared"] .face .normal,[data-mood="scared"] .face .awake{display:none}
[data-mood="scared"] .face .scared{display:inline}
.actor .eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.actor.shada .eyes-open{animation-delay:-1.9s}
.actor.walking .bob{animation:hop .25s ease-in-out infinite}
.actor.walking .shadow{animation:hopShadow .25s ease-in-out infinite}
.actor.working .bob{animation:work .42s ease-in-out 1}
.actor.tumble .bob{animation:tumble .7s ease-in-out 1}
.actor.wobble .bob{animation:wobble .46s ease-in-out infinite}
.actor.sleeping .bob{animation:snooze 2.8s ease-in-out infinite}
.actor.scared .bob{animation:tremble .16s linear infinite}
.actor.lookup .bob{transform:rotate(-16deg) translateY(-6%);transition:transform .3s}
.actor .carry{position:absolute;left:50%;top:-34%;width:20px;height:20px;margin-left:-10px;display:none}
.actor.carrying .carry{display:block}
/* しゃだはる君のよろこびかた（夕ごはん）：ぴょんぴょん はねる／しっぽを ふりふり */
.actor.jumping .bob{animation:hop .3s ease-in-out 3}
.actor .tail{transform-box:fill-box;transform-origin:0% 100%}
.actor.wag .tail{animation:wag .2s ease-in-out infinite}
/* おうちの中で、手に持っているもの（えりちゃん＝きょうの収穫、ほまれくん＝冷蔵庫から出したもの）。offer＝相手にさし出す */
.actor .hold{position:absolute;left:50%;top:104%;display:none;transform:translate(-50%,0);transition:transform .34s ease-out;z-index:3}
.actor.holding .hold{display:block}
.actor.offer .hold{transform:translate(calc(-50% - 23px),-42px)}
.actor.show .hold{transform:translate(calc(-50% - 37px),-51px)}
.actor .holdIn{display:flex;flex-wrap:wrap-reverse;align-items:center;justify-content:center;width:max-content;max-width:40px}
.actor.holding .holdIn{animation:popIn .4s ease-out}
.actor .hold svg{width:19px;height:19px;display:block;flex:none;margin:0 -2px}
.actor .carry svg{width:100%;height:100%;display:block}
.actor.watching::after{content:"じーっ";position:absolute;right:70%;top:-30%;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;animation:stare 2.6s ease-in-out infinite}
.actor.sleeping::before,.actor.sleeping::after{
  content:"z";position:absolute;right:-6%;top:-4%;font-size:14px;font-weight:700;color:var(--muted);
  opacity:0;animation:zzz 2.8s ease-out infinite;
}
.actor.sleeping::after{animation-delay:1.4s;font-size:11px}

/* 吹き出し */
.bubble{
  position:absolute;bottom:112%;width:max-content;max-width:min(190px,48vw);
  line-break:strict;overflow-wrap:anywhere;
  padding:7px 10px;border-radius:12px;background:#fff;border:1px solid var(--border);
  font-size:13px;line-height:1.45;color:var(--text);text-align:left;text-wrap:balance;line-break:strict;
  opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s;pointer-events:none;
}
.bubble.on{opacity:1;transform:none}
.bubble span{display:inline-block;max-width:100%}
.bubble::after{content:"";position:absolute;bottom:-6px;width:10px;height:10px;background:#fff;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.bubble.toL{right:28%}.bubble.toL::after{right:12px}
.bubble.toR{left:28%}.bubble.toR::after{left:12px}

.fx{position:absolute;left:0;top:0;z-index:60;pointer-events:none}
.fx>span{display:block;width:26px;height:26px;transform:translate(-50%,-50%)}
.fx svg{width:100%;height:100%;display:block}
.fx.pop>span{animation:pop .7s ease-out forwards}
.fx.fly>span{animation:arc .52s ease-out forwards}
.fx.away>span{animation:away .8s ease-in forwards}
.fx.snack{transition:opacity .3s}
.fx.snack>span{width:30px;height:30px;animation:snackIn .4s ease-out}
.fx.text>span{width:auto;height:auto;font-size:13px;font-weight:700;color:#3f7a35;white-space:nowrap;animation:pop .9s ease-out forwards}
.fx.text.thunder>span{font-size:17px;color:#4b5670;text-shadow:0 0 6px #fff,0 0 2px #fff;animation-duration:1.3s}
.fx.text.ice>span{color:#3f6a86}

/* 季節のまいちるもの（春＝花びら、秋＝落ち葉）。雨や雪の日は出さない */
.seasonFx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:69;display:none}
.vp[data-season="0"] .seasonFx{display:block;opacity:.95;
  background-image:radial-gradient(ellipse 4.5px 3px at 20px 30px,#f7b1c4 98%,transparent),radial-gradient(ellipse 3.4px 2.4px at 70px 90px,#fbd0db 98%,transparent),radial-gradient(ellipse 4px 2.6px at 130px 60px,#f9c0cf 98%,transparent),radial-gradient(ellipse 3px 2.2px at 44px 200px,#f7b1c4 98%,transparent);
  background-size:190px 230px,137px 171px,233px 193px,171px 263px;animation:drift0 13s linear infinite}
.vp[data-season="2"] .seasonFx{display:block;opacity:.9;
  background-image:radial-gradient(ellipse 5.5px 3.2px at 30px 40px,#d9773a 98%,transparent),radial-gradient(ellipse 4.4px 2.8px at 80px 100px,#c9573a 98%,transparent),radial-gradient(ellipse 5px 3px at 150px 70px,#e2a13e 98%,transparent),radial-gradient(ellipse 4px 2.6px at 50px 210px,#d9773a 98%,transparent);
  background-size:190px 230px,137px 171px,233px 193px,171px 263px;animation:drift0 15s linear infinite}
.vp.raining .seasonFx{display:none}
/* 風の時間（春＝そよ風、秋＝落ち葉の風）：花びらや落ち葉が横に流れ、野菜と木がゆれる */
.vp.windy[data-season="0"] .seasonFx,.vp.windy[data-season="2"] .seasonFx{animation:driftWind 5.5s linear infinite}
.windFx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:69;overflow:hidden;opacity:0;transition:opacity 1.2s}
.vp.windy .windFx{opacity:1}
.windFx i{position:absolute;right:-130px;width:96px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));animation:streak 3.2s linear infinite;animation-play-state:paused}
.vp.windy .windFx i{animation-play-state:running}
.windFx i:nth-child(1){top:22%;animation-delay:-.4s}
.windFx i:nth-child(2){top:39%;width:70px;animation-delay:-1.5s;animation-duration:2.7s}
.windFx i:nth-child(3){top:56%;animation-delay:-2.3s;animation-duration:3.6s}
.windFx i:nth-child(4){top:72%;width:60px;animation-delay:-.9s;animation-duration:2.9s}
.windFx i:nth-child(5){top:87%;animation-delay:-2.9s}
.vp.windy .plot .crop{animation:sway 1.7s ease-in-out infinite;transform-origin:50% 92%}
.vp.windy #trees{animation:treeSway 2.8s ease-in-out infinite;transform-origin:50% 100%}
/* 雪がふったあとは、地面がうっすら白くなる */
.ground::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(#ffffff,#eef3f7);opacity:0;transition:opacity 2.4s;pointer-events:none}
.vp.snowcover .ground::after{opacity:.74}
/* 雨あがりの虹 */
.rainbow{position:absolute;left:5%;top:30px;width:230px;height:115px;display:block;opacity:0;transition:opacity 1.8s}
.vp.rainbowOn .rainbow{opacity:.78}
/* かみなり：画面がふわっと光る（まぶしすぎない明るさで、間をあけて） */
.bolt{position:absolute;left:0;top:0;right:0;bottom:0;background:#fffbe8;opacity:0;pointer-events:none;z-index:72}
.vp.storm .bolt{animation:storm 11s linear infinite}
.bolt.on,.vp.storm .bolt.on{animation:boltFlash .6s ease-out}
.seasonCard{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.96);z-index:150;pointer-events:none;opacity:0;transition:opacity .45s,transform .45s;
  background:var(--seasonBg,#fff);border:2px solid var(--seasonLine,#ddd);border-radius:20px;padding:14px 20px;text-align:center;min-width:210px;max-width:86%}
.seasonCard.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.seasonCard svg{width:54px;height:54px;display:block;margin:0 auto 4px}
.seasonCard b{display:block;font-size:20px;color:var(--seasonInk,#463f37)}
.seasonCard span{display:block;font-size:13px;color:var(--text);margin-top:4px}
.snowball{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:1px solid #c3ccd6;z-index:29;transition:transform 600ms linear}
.tint{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:70;transition:background-color .8s,opacity .8s}
.weather{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:71;display:none}
.weather.rain{display:block;background-image:repeating-linear-gradient(104deg,rgba(255,255,255,0) 0 13px,rgba(110,150,195,.34) 13px 14.5px);background-size:120px 120px;animation:rain .5s linear infinite}
.weather.rain.storm{background-image:repeating-linear-gradient(104deg,rgba(255,255,255,0) 0 9px,rgba(90,125,175,.44) 9px 10.6px);animation-duration:.38s}
.weather.snow{display:block;background-image:radial-gradient(circle,#fff 0 2.2px,rgba(255,255,255,0) 2.6px),radial-gradient(circle,#fff 0 1.6px,rgba(255,255,255,0) 2px),radial-gradient(circle,#fff 0 1.9px,rgba(255,255,255,0) 2.3px);background-size:97px 89px,61px 67px,139px 113px;background-position:0 0,30px 20px,70px 50px;animation:snow 6s linear infinite}
.peek{
  position:absolute;top:44%;z-index:80;display:none;align-items:center;gap:4px;
  border:1px solid var(--border);background:#fff;border-radius:20px;padding:4px 8px 4px 4px;cursor:pointer;font-weight:700;color:var(--red);
}
.peek.on{display:flex}
.peek.left{left:8px}.peek.right{right:8px;flex-direction:row-reverse;padding:4px 4px 4px 8px}
.peek .mini{width:30px;height:30px}
.pan{position:absolute;top:8px;z-index:80;display:none;border:1px solid var(--border);background:rgba(255,255,255,.85);border-radius:50%;width:36px;height:36px;cursor:pointer}
.pan.l{left:8px}.pan.r{right:8px}
@media (hover:hover) and (pointer:fine){.pan{display:block}}

/* 下のパネル */
.panel{margin-top:10px;display:grid;gap:8px}
.held{display:none;align-items:center;gap:8px;border:1px solid #a8b394;background:#eef2e7;border-radius:14px;padding:6px 8px 6px 12px;font-size:14px}
.held.on{display:flex}
.held svg{width:26px;height:26px;flex:none}
.held .grow{flex:1}
.log{border:1px solid var(--border);border-radius:16px;background:#fff;padding:10px 14px}
.logTitle{font-size:13px;font-weight:700;margin-bottom:2px}
.logText{font-size:14px;color:var(--muted);min-height:2.9em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:#e8eddc}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns .btn{flex:1 1 auto}

/* かさなる画面（種えらび・夕がた・にっき） */
.sheet{position:absolute;left:0;top:0;right:0;bottom:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(70,63,55,.28);border-radius:20px;padding:10px}
.sheet.on{display:flex}
.sheet.center{align-items:center}
.card{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:14px}
.card h2{font-size:16px;margin:0 0 4px}
/* かさなる画面の見出し：スクロールしても上に残り、いつでも右上の「とじる」が押せる */
.cardHead{position:sticky;top:-14px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:-14px -14px 10px;padding:10px 10px 8px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.cardHead h2{margin:0;font-size:17px}
.closeX{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:12px;font-weight:700;background:#fff}
.closeX span{font-size:16px;line-height:1}
.card p{margin:4px 0;font-size:14px}
.card .sub{color:var(--muted);font-size:13px}
.seeds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.seed{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--border);background:#fff;border-radius:14px;padding:8px 10px;min-height:56px;cursor:pointer}
.seed svg{width:34px;height:34px;flex:none}
.seed b{display:block;font-size:14px}
.seed span{display:block;font-size:12px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.seed.last{border-color:#a8b394;background:#f4f7ee}
.seeds.menu{grid-template-columns:1fr}
.seed .icons{display:flex;flex:none}
.seed .icons svg{width:30px;height:30px}
.seed em{font-style:normal;font-size:11px;border-radius:7px;padding:1px 6px;margin-left:2px;white-space:nowrap}
.seed em.tagNew{background:#fdf0c4;color:#7a5a12}
.seed em.tagReq{background:#e4f2fb;color:#2d6a94}
.grpTitle{font-size:12px;color:var(--muted);margin:8px 0 0}
.talk{display:flex;align-items:flex-start;gap:8px;margin:8px 0;font-size:14px}
.talk .mini{width:30px;height:30px;flex:none}
.talk div{background:#fff;border:1px solid #eee5d9;border-radius:12px;padding:7px 10px}
.mini{display:inline-block}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tally span{display:inline-flex;align-items:center;gap:4px;border:1px solid #eee5d9;background:#fff;border-radius:10px;padding:3px 8px;font-size:13px}
.tally span.zero{opacity:.45}
.tally svg{width:20px;height:20px}
.dish{display:inline-block;background:#fdf0c4;color:#7a5a12;border-radius:8px;padding:1px 7px;font-size:12px;margin-left:6px}
.card ul{margin:4px 0;padding-left:1.2em;font-size:14px}
.card li{margin:2px 0}
.rowEnd{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.night{background:rgba(38,44,70,.55)}
/* おうちの夕がた */
.home{position:absolute;left:0;top:0;right:0;bottom:0;z-index:180;display:none;overflow:hidden;background:#f7eedd;opacity:0;transition:opacity .5s}
.home.on{display:block}
.home.show{opacity:1}
.homeStage{position:absolute;left:50%;bottom:0;width:360px;height:440px;margin-left:-180px;transform-origin:50% 100%}
.roomArt{position:absolute;left:0;top:0;width:360px;height:440px;display:block;overflow:visible}
.roomArt.front{z-index:215;pointer-events:none}
.roomArt.table{z-index:330;pointer-events:none}
/* おうちの中では、顔だけでなく体もつける（畑の上は今までどおり顔だけのコマ） */
.hbody{position:absolute;left:50%;top:76%;width:44px;height:44px;margin-left:-22px;display:block;overflow:visible}
.home .actor .bob{transform-origin:50% 165%}
.home .actor .face{position:relative}
.home .actor .shadow{bottom:-80%;left:8%;right:8%}
.home .actor.shada .shadow{bottom:-58%;left:16%;right:16%}
.home .actor.shada .bob{transform-origin:50% 146%}
.roomArt .popIn{transform-box:fill-box;transform-origin:center;animation:popIn .6s ease-out}
.fanBlades{transform-box:fill-box;transform-origin:50% 72%;animation:spin 1.1s linear infinite}
#homeActors .actor{pointer-events:none}
.home .bubble{max-width:214px}
.hTreasures{position:absolute;left:22px;top:94px;width:80px;height:18px;z-index:1}
.hTreasures svg{position:absolute;top:1px;width:16px;height:16px}
/* 冷蔵庫：とびらが開いているあいだだけ、中のものが見える */
.hFridgeItems{position:absolute;left:162px;top:216px;width:32px;height:74px;z-index:2;display:none}
.hFridgeItems.on{display:block}
.hFridgeItems svg{position:absolute;left:7px;width:18px;height:18px}
.fridgeNow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 0;font-size:13px;color:var(--muted)}
.fridgeNow span{display:inline-flex;align-items:center;gap:3px;border:1px solid #dfe6e3;background:#f4f8f6;border-radius:10px;padding:2px 8px;color:var(--text)}
.fridgeNow svg{width:18px;height:18px}
.hBasketItems{position:absolute;left:12px;top:168px;width:40px;height:26px;z-index:214}
.hBasketItems svg{position:absolute;width:17px;height:17px}
.hSteam{position:absolute;left:62px;top:128px;width:40px;height:40px;z-index:216;opacity:0;transition:opacity .4s}
.hSteam.on{opacity:1}
.hSteam i{position:absolute;bottom:0;width:7px;height:16px;border-radius:50%;border:2.4px solid rgba(180,172,160,.9);border-color:rgba(180,172,160,.9) transparent transparent rgba(180,172,160,.9);animation:steam 1.6s ease-in-out infinite}
.hSteam i:nth-child(1){left:4px}.hSteam i:nth-child(2){left:16px;animation-delay:.5s}.hSteam i:nth-child(3){left:28px;animation-delay:1s}
.hDish{position:absolute;left:222px;top:296px;width:80px;height:46px;z-index:400;display:none}
.hDish.on{display:block;animation:popIn .5s ease-out}
.hDish svg{width:100%;height:100%;display:block;overflow:visible}
.hDish.eaten svg use{opacity:.25}
.hBlanket{position:absolute;left:166px;top:396px;width:124px;height:34px;border-radius:14px 14px 10px 10px;background:#b9cbe0;border:2px solid #9bb2cc;z-index:460;display:none;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 8px,rgba(255,255,255,0) 8px 16px)}
.hBlanket.on{display:block;animation:popIn .5s ease-out}
.hFlash{position:absolute;left:-400px;right:-400px;top:-100px;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:600}
.hFlash.on{animation:flash .5s ease-out}
.evening{display:none;border:1px solid var(--border);border-radius:16px;background:#fff;padding:10px 12px}
.evening.on{display:block}
.eveInfo{font-size:14px}
.eveInfo p{margin:2px 0}
.panel.atHome .btns,.panel.atHome .held{display:none}
.plate{display:block;margin:6px auto 0;width:150px;height:84px}
.xfer textarea{width:100%;height:60px;font-size:16px;line-height:1.2;border:1px solid var(--border);border-radius:10px;padding:6px;font-family:ui-monospace,monospace;color:var(--muted);background:#fff;resize:none}
.xfer .msg{font-size:12px;color:var(--muted);min-height:1.4em}

@keyframes hop{0%,100%{transform:translateY(0) scale(1.05,.95) rotate(var(--lean,0deg))}50%{transform:translateY(-30%) scale(.97,1.04) rotate(var(--lean,0deg))}}
@keyframes hopShadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.6}}
@keyframes work{0%,100%{transform:rotate(0) translateY(0)}25%,75%{transform:rotate(calc(var(--side,1)*11deg)) translateY(7%)}50%{transform:rotate(0) translateY(0)}}
@keyframes tumble{0%{transform:rotate(0)}100%{transform:rotate(calc(var(--side,1)*-360deg))}}
@keyframes wobble{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes tremble{0%,100%{transform:translateX(-1.5%)}50%{transform:translateX(1.5%)}}
@keyframes snooze{0%,100%{transform:scale(1)}50%{transform:scale(1.035,.975)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0)}25%{opacity:.9}100%{opacity:0;transform:translate(40%,-90%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
@keyframes stare{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}30%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@keyframes arc{0%{transform:translate(-50%,-50%)}45%{transform:translate(-50%,-150%)}100%{transform:translate(-50%,-50%)}}
@keyframes snackIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes wag{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(18deg)}}
@keyframes away{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(160%,-260%) rotate(40deg)}}
@keyframes poke{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12,.9)}100%{transform:scale(1)}}
@keyframes ripe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes popIn{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes drift0{from{background-position:0 0,40px 30px,90px 10px,20px 70px}to{background-position:-190px 230px,-97px 201px,-143px 203px,-151px 333px}}
@keyframes driftWind{from{background-position:0 0,40px 30px,90px 10px,20px 70px}to{background-position:-380px 230px,-234px 201px,-376px 203px,-322px 333px}}
@keyframes streak{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 260px))}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(3deg)}}
@keyframes treeSway{0%,100%{transform:skewX(0deg)}50%{transform:skewX(1.4deg)}}
@keyframes storm{0%,90%{opacity:0}91%{opacity:.34}92.5%{opacity:0}94%{opacity:.22}96%,100%{opacity:0}}
@keyframes boltFlash{0%{opacity:0}12%{opacity:.62}30%{opacity:.1}42%{opacity:.4}100%{opacity:0}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rain{from{background-position:0 0}to{background-position:-30px 120px}}
@keyframes snow{from{background-position:0 0,30px 20px,70px 50px}to{background-position:18px 89px,42px 87px,56px 163px}}

@media (max-width:420px){
  .game{padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .chip{padding:6px 10px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .actor,.actor *,.actor::before,.actor::after,.fx,.fx *,.plot,.plot *,.basketFront,.deco,.weather,.bubble,.seasonFx,.windFx,.windFx i,.bolt,.ground::after,.rainbow,.seasonCard,.snowball,.home,.hSteam i,.fanBlades,.hDish,.hBlanket,.hFlash,#actors .actor.homare.on{animation:none!important;transition:none!important}
}

    shoo:(c,o,t)=>tone(c,o,t,{f:620,f2:1500,type:'triangle',dur:.28,vol:.09,attack:.02}),

  function build(){
    if(ctx || !AC) return;
    try{
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=MASTER_VOL;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=8; comp.attack.value=.004; comp.release.value=.2;

  }
  /* さいしょのタップで音の準備をする（ブラウザのきまり）。止まっていたら、タップのたびに動かしなおす */
  function unlock(){
    if(!enabled()) return;
    build();
    if(ctx && ctx.state!=='running'){ try{ const p=ctx.resume(); if(p&&p.then) p.then(ambient,()=>{}); }catch(e){} }
    else if(ctx) music();

  function play(name,delay){
    if(!enabled() || !SFX[name]) return;
    counts[name]=(counts[name]||0)+1;
    if(name==='pet'||name==='bau') voiceAt=performance.now();
    if(!ctx || ctx.state!=='running') return;
    const now=ctx.currentTime;
    if(!delay && last[name]!=null && now-last[name]<.05) return;
    last[name]=now;
    try{ SFX[name](ctx,master,now+.015+(delay||0)); }catch(e){}
  }
  /* しゃだはる君の声（ころんとした短い音）。毎回だと うるさいので、ときどき（半分くらい。1.6秒はあける。なでた直後は鳴らさない） */
  let voiceAt=-9999;
  function bau(){
    if(!enabled() || performance.now()-voiceAt<1600 || Math.random()>.5) return;
    play('bau');
  }
  /* 雨の音（ふっているあいだ、小さく流しつづける）。おうちの中では、こもった音にする */
  function ambient(){
    const raining=enabled() && !!S && S.raining && !(S.wx && S.wx.kind==='snow') && season()!==3;
    const indoor=home.classList.contains('on');
    const kind=!raining?'':(indoor?'in':(S.wx&&S.wx.kind==='storm'?'storm':'rain'));
    music();
    if(kind===ambKind) return;
    ambKind=kind;
    if(!ctx || ctx.state!=='running'){ ambKind=''; return; }
    const now=ctx.currentTime;
    if(!kind){ if(amb){ const a=amb; amb=null; a.g.gain.setTargetAtTime(.0001,now,.4); setTimeout(()=>{ try{ a.src.stop(); }catch(e){} },2500); } return; }
    if(!amb){
      const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx); src.loop=true;
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=.45;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6000;
      const g=ctx.createGain(); g.gain.value=.0001;
      src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master); src.start();
      amb={src,lp,g};
    }
    amb.g.gain.setTargetAtTime({rain:.035,storm:.055,in:.022}[kind],now,.6);
    amb.lp.frequency.setTargetAtTime(kind==='in'?650:6000,now,.3);
  }
  /* ---------- 音楽（v1.9.0）：畑の曲と、おうちの曲。オルゴールと木琴のような音で、小さめの音量でくり返す ----------
     曲は、このゲームのために作ったもの。TUNES の mel が1小節ずつのメロディ（1つの区切り＝8分音符。「-」は のばす・やすむ）、chords が和音。
     曲を直すときは TUNES を、音量は MUSIC_VOL を、音色は mbox（オルゴール）と marimba（木琴）をいじる。 */
  const MUSIC_VOL=1.3;   /* 音楽の音量。大きい・小さいと言われたら、まずここ（0.8〜1.8くらい） */
  const TUNES={
    field:{ bpm:100, slots:8, gap:2, melVol:.055, accVol:.026,
      mel:['E5 - G5 - C6 - G5 -','A5 - G5 - E5 - - G5','A5 - C6 - A5 - F5 -','G5 - B5 - D6 - - -',
           'E5 - G5 - C6 - E6 -','E6 - C6 - A5 - - C6','A5 - F5 - G5 - B5 -','C6 - - - G5 - E5 -',
           'F5 - A5 - C6 - A5 -','G5 - C6 - E6 - C6 -','D6 - A5 - F5 - A5 -','G5 - B5 - D6 - B5 G5',
           'E5 - G5 - C6 - G5 -','A5 - C6 - E6 - C6 -','C6 - A5 - B5 - G5 -','C6 - - - - - - -'],
      chords:['C','Am','F','G','C','Am','F G','C','F','C','Dm','G','C','Am','F G','C'] },
    home:{ bpm:84, slots:6, gap:2, melVol:.055, accVol:.026,
      mel:['A5 - - - C6 -','D6 - - - C6 -','Bb5 - - - A5 -','G5 - - - - -',
           'A5 - - - C6 -','D6 - - - F6 -','E6 - D6 - Bb5 -','A5 - - - - -',
           'D6 - Bb5 - D6 -','C6 - A5 - C6 -','Bb5 - G5 - Bb5 -','G5 - C6 - E6 -',
           'F6 - - - C6 -','D6 - - - A5 -','Bb5 - G5 - E5 -','F5 - - - - -'],
      chords:['F','Bb','Gm','C','F','Bb','C','F','Bb','F','Gm','C','F','Dm','C','F'] }
  };
  const CHORD={C:['C4','E4','G4'],Am:['A3','E4','C5'],F:['F4','A4','C5'],G:['G4','B4','D5'],Dm:['D4','F4','A4'],Bb:['Bb3','F4','D5'],Gm:['G4','Bb4','D5']};
  const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const hz=n=>{ const m=/^([A-G])(b|#)?(\d)$/.exec(n); return m ? 440*Math.pow(2,((+m[3]+1)*12+SEMI[m[1]]+(m[2]==='b'?-1:m[2]==='#'?1:0)-69)/12) : 0; };
  function mbox(c,out,t,f,vol,long){ tone(c,out,t,{f,dur:long?2.4:1.5,vol,attack:.004}); tone(c,out,t,{f:f*2,dur:.7,vol:vol*.3,attack:.004}); tone(c,out,t,{f:f*3,dur:.25,vol:vol*.1,attack:.003}); }
  function marimba(c,out,t,f,vol){ tone(c,out,t,{f,dur:.6,vol,attack:.004}); tone(c,out,t,{f:f*4,dur:.12,vol:vol*.2,attack:.003}); }
  /* step＝曲のはじめから数えた区切りの番号。その区切りで鳴る音を、時刻 t に予約する */
  function playSlot(c,out,T,step,t){
    const bar=Math.floor(step/T.slots), k=step%T.slots;
    if(bar>=T.mel.length) return;                       /* くり返しの前の、ひと休み */
    const tok=T.mel[bar].split(' ')[k];
    if(tok && tok!=='-'){ const rest=T.mel[bar].split(' ').slice(k+1).every(x=>x==='-'); mbox(c,out,t,hz(tok),T.melVol,rest&&k<=T.slots/2); }
    if(k%2===0){
      const beat=k/2, ch=T.chords[bar].split(' '), half=T.slots/4;
      const name=ch.length>1 ? ch[beat<half?0:1] : ch[0], i=ch.length>1 ? (beat<half?beat:beat-half) : beat;
      const tones=CHORD[name]; if(tones) marimba(c,out,t,hz(tones[[0,1,2,1][i%4]]),T.accVol*(beat===0?1.25:1));
    }
  }

  const musicOn=()=>!!S && (S.sound==null || S.sound==='all');
  function musicWant(){ if(!ctx || ctx.state!=='running' || !musicOn() || performance.now()<quietUntil) return ''; return forced || (home.classList.contains('on')?'home':'field'); }
  function tick(){
    if(!mus || !ctx || ctx.state!=='running') return;
    const T=TUNES[mus.name], slot=60/T.bpm/2, total=(T.mel.length+T.gap)*T.slots;
    if(mus.nextT<ctx.currentTime-.05) mus.nextT=ctx.currentTime+.12;      /* 画面をとじていた等で おくれたら、いまから続ける */
    while(mus.nextT<ctx.currentTime+.5){ try{ playSlot(ctx,mbus,T,mus.step,mus.nextT); }catch(e){} mus.step=(mus.step+1)%total; mus.nextT+=slot; }
  }
  function fadeOut(){ if(mus){ clearInterval(mus.timer); mus=null; } if(ctx&&mbus){ mbus.gain.cancelScheduledValues(ctx.currentTime); mbus.gain.setTargetAtTime(.0001,ctx.currentTime,.3); } }
  function musicLevel(){ if(!mus||!ctx) return; mbus.gain.cancelScheduledValues(ctx.currentTime); mbus.gain.setTargetAtTime(MUSIC_VOL*(S&&S.raining?.6:1),ctx.currentTime,.6); }
  /* いま流すべき曲（畑／おうち／なし）にあわせる。場面が変わるたびに呼ぶ */
  function music(){

    fadeOut(); clearTimeout(musT);
    if(want) musT=setTimeout(()=>{ if(mus || musicWant()!==want) return; mus={name:want,step:0,nextT:ctx.currentTime+.15}; mus.timer=setInterval(tick,120); tick(); musicLevel(); }, cur?1200:350);

  function refreshBtn(){
    const b=document.getElementById('sndBtn'); if(!b) return;

  }
  /* 音あり（音楽＋効果音）→ 効果音だけ → 音なし → 音あり… */
  function toggle(){
    if(!S) return;

  }
  /* しらべる用：曲を、音の出ない場所で sec 秒ぶん作って、大きさを数字で返す */
  async function renderTune(name,sec){
    const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext, sr=44100, T=TUNES[name];
    const oc=new OC(1,Math.floor(sr*sec),sr), bus=oc.createGain(); bus.gain.value=MUSIC_VOL; bus.connect(oc.destination);
    const slot=60/T.bpm/2, total=(T.mel.length+T.gap)*T.slots; let n=0;
    for(let st=0,t=.05; t<sec-.1; st++,t+=slot){ playSlot(oc,bus,T,st%total,t); n++; }
    const d=(await oc.startRendering()).getChannelData(0);
    let peak=0,sum=0,bad=0; const per=[];
    for(let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(!(v>=0)) bad++; if(v>peak) peak=v; sum+=v*v; }
    for(let i=0;i+sr<=d.length;i+=sr){ let s2=0; for(let k=i;k<i+sr;k++) s2+=d[k]*d[k]; per.push(Math.sqrt(s2/sr)); }
    return {name,slots:n,peak:+peak.toFixed(3),rms:+Math.sqrt(sum/d.length).toFixed(4),rmsMax:+Math.max(...per).toFixed(4),bad,loopSec:+(total*slot).toFixed(1)};
  }
  /* しらべる用：1つの音を、音の出ない場所で作って、大きさなどを数字で返す */
  async function render(name,sec){
    const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext, sr=44100;
    const oc=new OC(1,Math.floor(sr*(sec||2.6)),sr);

    let peak=0,at=0,end=0,bad=0;
    for(let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(!(v>=0)) bad++; if(v>peak){ peak=v; at=i; } if(v>.003) end=i; }
    /* いちばん強い0.1秒ぶんの大きさ（耳で感じる「大きさ」に近い） */
    let loud=0; const w=Math.floor(sr*.1);
    for(let i=0;i+w<=d.length;i+=Math.floor(w/2)){ let s2=0; for(let k=i;k<i+w;k++) s2+=d[k]*d[k]; loud=Math.max(loud,Math.sqrt(s2/w)); }
    return {name,peak:+peak.toFixed(3),at:+(at/sr).toFixed(3),loud:+loud.toFixed(3),sec:+(end/sr).toFixed(2),bad};
  }
  function snooze(){ if(ctx && ctx.state==='running'){ try{ ctx.suspend(); }catch(e){} } }
  return {play,bau,unlock,ambient,toggle,refreshBtn,render,counts,names:()=>Object.keys(SFX),state:()=>ctx?ctx.state:'none',
    music,hush:musicHush,musicTest,renderTune,sleep:snooze,tune:()=>mus?mus.name:'',TUNES,CHORD,hz};
})();

/* ================= セーブ（遊ぶ場所に合わせて、使える保存先を順にためす） ================= */
let saveOK=null, saveTimer=null;
const Store={
  async load(){
    try{
      if(window.storage && window.storage.get){
        const r=await window.storage.get(KEY,false);
        if(r && r.value) return JSON.parse(r.value);
      }
    }catch(e){}
    try{ const v=window.localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return null;
  },
  async save(data){
    const v=JSON.stringify(data); let ok=false;
    try{ if(window.storage && window.storage.set){ const r=await window.storage.set(KEY,v,false); ok=!!r; } }catch(e){}
    if(!ok){ try{ window.localStorage.setItem(KEY,v); ok=true; }catch(e){} }
    saveOK=ok; return ok;
  },
  async clear(){
    try{ if(window.storage && window.storage.delete) await window.storage.delete(KEY,false); }catch(e){}
    try{ window.localStorage.removeItem(KEY); }catch(e){}
  }
};
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(S) Store.save(S); },1200); }
function saveNow(){ clearTimeout(saveTimer); return S?Store.save(S):Promise.resolve(false); }

function newGame(){

    const gh=i>=12, col=i%4, row=Math.floor(i/4);
    const start=!gh && col<3 && row<2;
    plots.push({unlocked:start,tilled:start||gh,crop:null,growth:0,watered:false,dry:false,soggy:false,frog:false,bug:false,frost:false});
  }
  return {

/* 前の版のセーブ（季節の長さがちがう）を読みこんだとき、同じ季節のまま続けられるように日付をなおす */
function normalize(d){
  const old=d.sd||7;
  if(old!==SEASON_DAYS && typeof d.day==='number'){
    const y=Math.floor((d.day-1)/(old*4)), sn=Math.floor((d.day-1)/old)%4, dd=((d.day-1)%old)+1;
    const nd=y*SEASON_DAYS*4+sn*SEASON_DAYS+Math.min(dd,SEASON_DAYS);
    if(Array.isArray(d.log)) d.log.forEach(l=>{ if(l.d===d.day) l.d=nd; });
    if(d.shadaPlot && d.shadaPlot.phase==='pending') d.shadaPlot.appearDay=nd+1;
    if(d.request && typeof d.request.until==='number') d.request.until=nd+Math.max(0,d.request.until-d.day);
    d.day=nd;
  }
  d.sd=SEASON_DAYS;
  return d;
}
/* きょうの冷蔵庫：4つの中から2つ。きのうとまったく同じ組み合わせにはしない */
function rollFridge(prev){
  const keys=Object.keys(FRIDGE), old=prev?prev.slice().sort().join():'';
  for(let n=0;n<8;n++){
    const i=Math.floor(rnd()*keys.length); let j=Math.floor(rnd()*(keys.length-1)); if(j>=i) j+=1;
    const a=[keys[i],keys[j]].sort();
    if(a.join()!==old) return a;
  }
  return [keys[0],keys[1]];
}
const fridgeOK=f=>Array.isArray(f) && f.length===2 && f.every(k=>!!FRIDGE[k]);
/* 前の版のセーブには、天気の「時間帯」がない。雨の日の途中だったなら、夕方までふる雨としてあつかう */
function fixup(){
  if(!fridgeOK(S.fridge)) S.fridge=rollFridge(null);
  if(!S.wx && S.weather==='rain') S.wx={kind:season()===3?'snow':'rain',from:S.rainAt||540,to:DAY_END+60};

}

/* 吹き出しが、相手の吹き出しや相手の顔にかぶるときは、かぶらない高さまで持ち上げる */
function layoutBubbles(e,s,box,scale){
  e.bub.style.bottom=''; s.bub.style.bottom='';
  const wr=box.getBoundingClientRect(), k=scale||1;
  const R=el=>{ const r=el.getBoundingClientRect(); return {l:(r.left-wr.left)/k,t:(r.top-wr.top)/k,r:(r.right-wr.left)/k,b:(r.bottom-wr.top)/k}; };
  const hit=(p,q)=>p.l<q.r+6 && q.l<p.r+6 && p.t<q.b+6 && q.t<p.b+6;
  const on=a=>a.bub.classList.contains('on');
  const liftAbove=(a,topY)=>{ const lift=(a.y+TOK/2)-(topY-8); if(lift>TOK*1.12) a.bub.style.bottom=Math.round(lift)+'px'; };
  if(on(e) && on(s) && hit(R(e.bub),R(s.bub))){
    const up=e.y<=s.y?e:s, base=up===e?s:e;
    liftAbove(up,R(base.bub).t);
  }
  [[e,s],[s,e]].forEach(([a,o])=>{
    if(!on(a) || !hit(R(a.bub),R(o.el))) return;
    liftAbove(a, on(o) ? Math.min(R(o.bub).t, o.y-TOK/2) : o.y-TOK/2);
  });
}

/* ================= 時間と育ち ================= */
function thirstyPlots(){ return S.plots.map((p,i)=>i).filter(i=>{const p=S.plots[i]; return p.unlocked&&p.crop&&!p.watered&&!p.frost&&!isRipe(p);}); }
function growingPlots(){ return S.plots.map((p,i)=>i).filter(i=>{const p=S.plots[i]; return p.unlocked&&p.crop&&!isRipe(p);}); }
function ripePlots(){ return S.plots.map((p,i)=>i).filter(i=>isRipe(S.plots[i])); }

async function advance(mins){
  const before=S.clock;
  S.clock=Math.min(DAY_END,S.clock+mins);
  const d=S.clock-before;
  meltFrost();
  weatherTick();
  const ripened=[];
  S.plots.forEach((p,i)=>{
    if(!p.crop || !p.watered || isRipe(p)) return;
    const st=stageOf(p);
    p.growth=Math.min(totalOf(p),p.growth+d);
    if(stageOf(p)!==st) poke(i);
    if(isRipe(p)) ripened.push(i);
  });
  const sp=S.shadaPlot;
  if(sp.phase==='grow'){
    sp.growth=Math.min(720,sp.growth+d);
    if(sp.growth>=720){ sp.phase='ripe'; poke('shada'); }
  }
  if(A.shada.mode==='nap' && S.clock>=A.shada.napUntil) wakeShada(true);
  spawnBug(d);
  renderHUD(); renderSky(); renderWorld(); renderPlots();
  if(A.shada.mode==='watch' && ripened.indexOf(A.shada.watchPlot)>=0) await watchDone();
  return ripened;
}
/* 天気：雨・夕立・雪・風には「時間帯」がある（S.wx＝{kind,from,to}）。時計が進んだときに、始まりと終わりをしらべる */
let wxQueue=[];
const isWet=k=>k==='rain'||k==='storm'||k==='snow';
function weatherTick(quiet){
  const w=S.wx; if(!w) return;
  const on=S.clock>=w.from && S.clock<w.to;
  if(isWet(w.kind)){
    if(on && !S.raining){ startRain(); if(!quiet) wxQueue.push('wetStart'); }
    else if(!on && S.raining && S.clock>=w.to){ stopRain(quiet); if(!quiet) wxQueue.push('wetEnd'); }
  }else{
    if(on && !S.windy){ S.windy=true; if(!quiet) wxQueue.push('windStart'); }
    else if(!on && S.windy){ S.windy=false; if(!quiet) wxQueue.push('windEnd'); }
  }
}
function startRain(){
  const k=S.wx?S.wx.kind:(season()===3?'snow':'rain');
  S.raining=true;
  S.plots.forEach(p=>{ if(p.crop) p.watered=true; p.bug=false; });
  if(k==='snow'){ S.snowCover=true; log('雪がふってきました。畑ぜんぶに、しっとり水がいきわたりました。'); }
  else log((k==='storm'?'夕立です。':'雨がふってきました。')+'畑ぜんぶに水がいきわたりました。');
}
function stopRain(quiet){
  S.raining=false;
  if(!quiet) log(S.wx&&S.wx.kind==='snow'?'雪がやみました。':'雨があがりました。');
}
/* 冬の朝の霜は、9時になるととける */
function meltFrost(){
  if(S.clock<FROST_MELT || !S.plots.some(p=>p.frost)) return;
  S.plots.forEach(p=>{ p.frost=false; });
  log('日がのぼって、畑の霜がとけました。');
}
/* 春と夏は、育ち中の野菜に虫がつきやすい。放っておいても害はなく、追いはらうと野菜が少し元気になる */
function spawnBug(d){
  const rate=BUG_RATE[season()]*(d/ACT);
  if(!rate || S.raining || S.clock>DAY_END-90) return;
  if(S.plots.filter(p=>p.bug).length>=2 || rnd()>rate) return;
  const c=growingPlots().filter(i=>{ const p=S.plots[i]; return !isGH(i) && !p.bug && !p.frost && stageOf(p)>=1; });
  if(!c.length) return;
  const i=pick(c); S.plots[i].bug=true; poke(i);
  log(CROPS[S.plots[i].crop].name+'に、虫がついています。タップすると、追いはらえます。');
}
/* 天気が変わったときの、ちいさな場面 */
async function weatherScenes(){
  while(wxQueue.length){
    const ev=wxQueue.shift(), k=S.wx?S.wx.kind:null, follow=A.shada.mode==='follow';
    if(ev==='wetStart'){
      if(k==='storm') await thunderScene();
      else if(follow){
        if(k==='snow'){ setMood('shada','happy',1800); say('shada','ゆき、ふってきたばう！'); if(rnd()<.6) setTimeout(()=>say('eri','つもるかな。',0,'smile'),800); }
        else{ say('shada','ふってきたばう。'); if(rnd()<.6) setTimeout(()=>say('eri','畑がよろこぶね。',0,'smile'),800); }
        await pause(1300);
      }
    }else if(ev==='wetEnd'){
      if(A.shada.mode==='hide') await stormReturn();
      if(k!=='snow' && S.clock<=DAY_END-60 && rnd()<(k==='storm'?.65:.4)) await rainbowScene();
    }else if(ev==='windStart'){
      log(k==='leaves'?'風がふいて、落ち葉が舞っています。':'そよ風がふいてきました。花びらが、畑の上を流れていきます。'); Snd.play('wind');
      if(follow){

        else{ say('shada','いいかぜばう。'); if(rnd()<.6) setTimeout(()=>say('eri','そよ風、気持ちいいね。',0,'smile'),800); }
        await pause(1300);
      }
    }else if(ev==='windEnd') log('風がやみました。');
  }
}

async function actPlot(i){
  if(modal || !S) return;

  if(busy){ setQueued(i); return; }
  if(p.frog){ tapFrog(i); return; }
  let kind;
  if(!p.tilled) kind='till';
  else if(p.crop && isRipe(p)) kind='harvest';
  else if(p.frost) kind='thaw';      /* こおった土は、ふんでほぐしてから */
  else if(!p.crop){
    if(!isGH(i) && S.held && allowedSeed(S.held,i)) kind='plant';
    else { openSeeds(i); return; }   /* 温室は毎回えらぶ（どの季節の種でもまけるので） */
  }
  else if(!p.watered) kind='water';
  else if(p.bug) kind='shoo';
  else { plotInfo(p); return; }
  await playerAction(kind,i,S.held);
}

const hp=ms=>homeSkip?Promise.resolve():pause(ms);
const bubHit=(p,q)=>{ const a=p.getBoundingClientRect(), b=q.getBoundingClientRect(); return Math.min(a.right,b.right)-Math.max(a.left,b.left)>2 && Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>2; };
function hbubOff(x){ clearTimeout(x.bubT); x.bub.classList.remove('on'); }
/* 歩きおわったとき、まだ吹き出しが出ていたら置きなおす。それでも だれかの吹き出しと重なるなら、しまう */
function hmove(a,spot,opt){
  if(homeSkip){ place(a,spot.x,spot.y,0); a.el.classList.remove('walking'); return Promise.resolve(); }
  return moveTo(a,spot,opt).then(()=>{
    if(!HA || !a.bub.classList.contains('on')) return;
    hLayout(a);
    if(Object.values(HA).some(x=>x!==a && x.bub.classList.contains('on') && bubHit(a.bub,x.bub))) hbubOff(a);
  });
}
function hmood(a,mood,ms){ clearTimeout(a.moodT); a.el.dataset.mood=mood; if(ms) a.moodT=setTimeout(()=>{ a.el.dataset.mood='normal'; },ms); }
/* opt は、数字（表示時間）か {ms, mood, dir}。mood＝そのセリフのあいだの表情、dir＝吹き出しの向き（'toL'／'toR'） */
function hsay(a,text,opt){
  if(homeSkip) return;
  const o=(opt && typeof opt==='object') ? opt : {ms:opt};
  const b=a.bub, dur=o.ms || (2000+text.length*95), now=Date.now();
  clearTimeout(a.bubT);
  if(HA && a===HA.shada) Snd.bau();
  /* ほかの人の吹き出しは、もう読めたころ（1.2秒たったもの）なら先にしまう。3人が同時に言うセリフ（いただきます）は残る */
  Object.values(HA).forEach(x=>{ if(x!==a && x.bub.classList.contains('on') && now-(x.bubAt||0)>=1200) hbubOff(x); });
  a.bubAt=now;
  b.innerHTML=bubbleHTML(text);
  b.classList.remove('toL','toR'); b.classList.add(o.dir || (a.x<170?'toR':'toL')); b.classList.add('on');
  hLayout(a);
  /* 持ち上げても まだ重なる相手の吹き出しは、しまう */
  Object.values(HA).forEach(x=>{ if(x!==a && x.bub.classList.contains('on') && bubHit(a.bub,x.bub)) hbubOff(x); });
  if(o.mood) hmood(a,o.mood,Math.min(dur,MOOD_MS[o.mood]||1700));
  a.bubT=setTimeout(()=>b.classList.remove('on'), dur);
}
/* いま話す人の吹き出しが、ほかの人の吹き出しや顔にかぶるなら、かぶらない高さまで持ち上げる */
function hLayout(a){
  const k=hScale||1;
  const R=el=>{ const wr=homeStage.getBoundingClientRect(), r=el.getBoundingClientRect(); return {l:(r.left-wr.left)/k,t:(r.top-wr.top)/k,r:(r.right-wr.left)/k,b:(r.bottom-wr.top)/k}; };
  const hit=(p,q)=>p.l<q.r+6 && q.l<p.r+6 && p.t<q.b+6 && q.t<p.b+6;
  const others=Object.values(HA).filter(o=>o!==a);
  const stack=()=>{
    a.bub.style.bottom='';
    for(let n=0;n<4;n++){
      const me=R(a.bub); let top=null;
      others.forEach(o=>{
        if(o.bub.classList.contains('on')){ const rb=R(o.bub); if(hit(me,rb)) top=top==null?rb.t:Math.min(top,rb.t); }
        const rh=R(o.el); if(hit(me,rh)) top=top==null?rh.t:Math.min(top,rh.t);
      });
      if(top==null) break;
      const lift=(a.y+TOK/2)-(top-8);
      if(lift<=TOK*1.12) break;
      a.bub.style.bottom=Math.round(lift)+'px';
    }
    return R(a.bub);
  };
  const flip=()=>{ const r=a.bub.classList.contains('toR'); a.bub.classList.toggle('toR',!r); a.bub.classList.toggle('toL',r); };
  let me=stack();
  if(me.t<2){
    /* 上にはみ出すなら、まず向きを反対にしてみる。それでもだめなら、画面の上ぎりぎりで止める */
    flip(); const alt=stack();
    if(alt.t<2 || alt.l<2 || alt.r>358){
      flip(); me=stack();
      const cur=parseFloat(a.bub.style.bottom)||0;
      if(cur) a.bub.style.bottom=Math.max(TOK*1.12,cur-(2-me.t))+'px';
    }
  }
}

/* えりちゃんの「きょうの収穫」の報告。1区切りが長くなるときは読点を入れて、吹き出しの中で単語が折れないようにする */

/* 夕ごはんのメニュー：畑でとれた野菜（今日と昨日のぶん）と、きょうの冷蔵庫のもので作れるもの。6つまで */
function dishCandidates(){
  const have=Object.keys(S.pantry||{}).filter(k=>S.pantry[k]>0), fr=S.fridge||[];
  const req=S.request?S.request.crop:null;
  const c=RECIPES.filter(r=>r.need.every(k=>have.indexOf(k)>=0) && (!r.fridge || fr.indexOf(r.fridge)>=0));
  const score=r=>(req&&r.need.indexOf(req)>=0?4:0)+(S.recipes[r.name]?0:2)+(r.need.length>1?1:0)+(r.fridge?.5:0);
  c.sort((a,b)=>score(b)-score(a));
  const top=c.slice(0,6), rest=c.slice(6);
  /* 「野菜だけ」と「冷蔵庫のものを使う料理」の、どちらも1つは入るようにする */
  [r=>!!r.fridge, r=>!r.fridge].forEach(is=>{
    if(top.length<6 || top.some(is)) return;
    const alt=rest.find(is); if(alt) top[top.length-1]=alt;
  });
  return top;
}

/* ほまれくんの「あしたのリクエスト」。とれなくても何も起きない、ゆるい目標 */
function makeRequest(){
  const ts=Math.floor(S.day/SEASON_DAYS)%4;   // あしたの季節
  const growing=S.plots.filter(p=>p.unlocked&&p.crop).map(p=>p.crop);
  const fast=Object.keys(CROPS).filter(k=>CROPS[k].season===ts && CROPS[k].speed==='fast');
  const pool=growing.concat(fast).filter((k,i,arr)=>arr.indexOf(k)===i);
  if(pool.length) return {crop:pick(pool),until:S.day+1,soon:true};
  return {crop:pick(Object.keys(CROPS).filter(k=>CROPS[k].season===ts)),until:S.day+3,soon:false};
}

      hsay(H,'はじめてのメニューだ。写真とっとこう。');

      S.photo={need:dish.need.slice(0,2),icons:dishIcons(dish),name:dish.name};
      updatePhoto(true);
      await hp(900);
    }
    /* 「いただきます。」は、3人そろって */
    hsay(E,'いただきます。',{mood:'smile'}); hsay(H,'いただきます。'); hsay(D,'いただきますばう。');
    await hp(1500);
    hhush();
    await Promise.all([hwork(E),hwork(H),hwork(D)]); hfxText('もぐもぐ',{x:D.x,y:D.y-34}); if(!homeSkip) Snd.play('eat'); await Promise.all([hwork(E),hwork(H),hwork(D)]);
    $('#hDish').classList.add('eaten');
    /* 食べたときのひとことは、日によって2とおり */
    yumH=pick(['美味しい！','美味しいなぁ！']); yumD=pick(['おいしいばう！','おいしすぎるばう！']);
    hmood(H,'happy',2800);
    hsay(H,yumH); if(!homeSkip) Snd.play('yum');
    hmood(E,'happy',3000);
    await hp(700);
    hmood(D,'happy',2800);
    hsay(D,yumD);
    hfx('i-heart',{x:D.x-10,y:D.y-30});
    /* よろこびかたは日によって2とおり：ぴょんぴょん はねる／しっぽを ふりふり */
    if(!reduceMotion && !homeSkip){
      if(rnd()<.5){
        D.el.style.setProperty('--lean','0deg'); D.el.classList.add('jumping'); [.12,.42,.72].forEach(d=>Snd.play('hop',d));
        hfxText('ぴょん ぴょん',{x:D.x-4,y:D.y+54});
        setTimeout(()=>{ D.el.classList.remove('jumping'); hfx('i-heart',{x:D.x+12,y:D.y-34}); },920);
      }else{
        D.el.classList.add('wag');
        hfxText('ふりふり',{x:D.x+2,y:D.y+54});
        setTimeout(()=>hfx('i-heart',{x:D.x+12,y:D.y-34}),700);
        setTimeout(()=>D.el.classList.remove('wag'),2300);
      }
    }
    await hp(1700);
    if(isNew){
      if(!reduceMotion&&!homeSkip){ D.el.classList.add('tumble'); await sleep(700); D.el.classList.remove('tumble'); }
      hsay(D,'はじめての味ばう！');
      await hp(1300);
    }else if(TAG_LINES[dish.tag] && rnd()<.6){
      hsay(D,TAG_LINES[dish.tag]);
      await hp(1400);
    }
    hsay(E,pick(['よかった。また作るね。','たくさんとれたからね。','しゃだはるのおかげだよ。']),{mood:'happy'});
    await hp(1400);
    if(rnd()<.45){
      hsay(H,pick(['えりちゃんの料理は、最高だなあ。','畑のとれたては、ちがうね。','おかわりある？','えりちゃん、ごちそうさま。']));
      await hp(1500);
    }
    S.nagomi+=isNew?2:1;
  }else{
    await Promise.all([hmove(E,HSPOT.tableEri), hmove(D,HSPOT.tableShada), hmove(H,HSPOT.tableHomare)]);
    hsay(E,'今日はゆっくり休もうね。',{mood:'smile'});
    await hp(1400);
    hsay(H,'そういう日もいいね。');
    await hp(1300);
    const pre=pickPre(true);
    if(pre) await pre(E,D,H);
  }

  /* ⑤ なごみ度でふえる、おうちのもの（ひと晩にひとつ） */
  if(!S.decor) S.decor={};
  const d=DECOR.find(x=>!S.decor[x.key] && S.nagomi>=x.at);
  if(d){
    S.decor[d.key]=true; newDecor=d;
    hsay(E,'そうだ。'+d.eri,{mood:'smile'});
    await hp(1300);
    const g=document.getElementById(d.g); g.style.display=''; if(!reduceMotion&&!homeSkip) g.classList.add('popIn'); if(!homeSkip) Snd.play('spark');
    await hp(900);
    hmood(D,'happy',2000); hmood(E,'happy',2000);
    hsay(D,d.shada);
    if(d.key==='cushion'){ await hp(600); await hmove(D,HSPOT.cushion); }
    await hp(1400);
  }else if(dish && rnd()<.28){
    /* ほまれくんとしゃだはる君が遊んで、ふたりとも寝落ち */
    await Promise.all([hmove(H,HSPOT.playH), hmove(D,HSPOT.playD)]);
    hsay(D,'ほまれくん、あそぶばう！');
    await hp(1300);
    hsay(H,'しゃだはる、それっ！');
    await hmove(D,{x:HSPOT.playD.x+52,y:HSPOT.playD.y-6}); await hmove(D,HSPOT.playD);
    hmood(D,'happy',1500);
    hsay(D,'もういっかいばう！');
    await hp(1400);
    [H,D].forEach(a=>{ a.el.classList.add('sleeping'); hmood(a,'sleepy'); });
    hhush();
    await hp(1600);
    $('#hBlanket').classList.add('on');
    hsay(E,'ふたりとも、ねちゃった。毛布かけとこう。',{mood:'smile'});
    await hp(1900);
    asleep=true; S.nagomi+=2;
  }

  /* ⑥ あしたのリクエスト */
  if(!asleep && !S.request && rnd()<.65){
    newReq=makeRequest(); S.request=newReq;
    const nm=CROPS[newReq.crop].name;
    hsay(H,(newReq.soon?'あしたは':'こんど、')+nm+'が食べたいなあ。');
    await hp(1600);
    hsay(E,newReq.soon?'じゃあ、あした見てみるね。':'じゃあ、育ててみるね。',{mood:'smile'});
    await hp(1300);
  }
  if(!asleep){
    if(S.decor.cushion && !newDecor && rnd()<.6) await hmove(D,HSPOT.cushion);
    hsay(D,'おやすみばう。');
    hmood(E,'smile',2400);
    await hp(700);
    hsay(H,'おやすみ。');
    await hp(800);
  }

  /* おわり：下の欄にまとめを出して、「おやすみ」を押せるようにする */
  homeSkipBtn.removeEventListener('click',skipHandler);
  if(homeSkip){
    /* とばしたときは、さいごの形にそろえる */
    place(E,HSPOT.tableEri.x,HSPOT.tableEri.y,0);
    place(H,HSPOT.tableHomare.x,HSPOT.tableHomare.y,0);
    const ds=(S.decor.cushion?HSPOT.cushion:HSPOT.tableShada); place(D,ds.x,ds.y,0);
    [H,D,E].forEach(a=>{ a.el.classList.remove('sleeping'); hmood(a,'normal'); });
    hhold(E,null); hhold(H,null); openFridge(false); if(passed){ passed.remove(); passed=null; }
    if(dish){ $('#hDish').classList.add('on','eaten'); $('#g-setting').style.display=''; }
    if(newDecor) document.getElementById(newDecor.g).style.display='';
    $('#hSteam').classList.remove('on'); $('#hBlanket').classList.remove('on');
    updatePhoto(false);
  }
  let info='<p class="sub">'+SEASONS[season()]+'・'+seasonDay()+'日目の夕がた</p>'+tallies;
  if(dish) info+='<p><strong>夕ごはん：'+esc(dish.name)+'</strong>'+(isNew?'<span class="dish">あたらしいレシピ</span>':'')+'</p>';
  if(reqDone) info+='<p>ほまれくんのリクエスト（'+esc(CROPS[reqDone].name)+'）が、かないました。</p>';
  if(newReq) info+='<p>ほまれくんのリクエスト：'+esc(CROPS[newReq.crop].name)+'</p>';
  if(newDecor) info+='<p>おうちにふえたもの：'+esc(newDecor.name)+'</p>';
  if(S.newToday.length) info+='<p class="sub">今日できたもの：'+S.newToday.map(esc).join('、')+'</p>';
  eveInfo.innerHTML=info;
  homeSkipBtn.style.display='none';
  sleepBtn.disabled=false;
  try{ sleepBtn.scrollIntoView({block:'nearest',behavior:reduceMotion?'auto':'smooth'}); sleepBtn.focus({preventScroll:true}); }catch(e){}
  if(dish) log('夕ごはんは'+dish.name+'。ほまれくんは「'+yumH+'」、しゃだはる君は「'+yumD+'」と大よろこびでした。');
  if(reqDone) log('ほまれくんのリクエストの'+CROPS[reqDone].name+'がとれて、とてもよろこんでいました。');
  if(newReq) log('ほまれくんが「'+(newReq.soon?'あしたは':'こんど、')+CROPS[newReq.crop].name+'が食べたいなあ」と言っていました。');
  if(asleep) log('ほまれくんとしゃだはる君は、遊びつかれて床で寝てしまいました。');
  if(newDecor) log('おうちに、'+newDecor.name+'がふえました。');
  await saveNow();
  await new Promise(res=>sleepBtn.addEventListener('click',res,{once:true}));
  sleepBtn.disabled=true; Snd.hush(4200); Snd.play('night',.5);
  hhush();
  home.classList.remove('show');
  await pause(450);
  home.classList.remove('on');
  eveningBar.classList.remove('on'); panelEl.classList.remove('atHome');
  Snd.ambient();
}

/* 料理を待つあいだ（または、ごはんのない夜）の出来事。E＝えりちゃん、D＝しゃだはる君、H＝ほまれくん */
function pickPre(quiet){
  const c=[];
  const back=(D,H)=>Promise.all([hmove(D,HSPOT.tableShada), hmove(H,HSPOT.tableHomare)]);
  if(!quiet) c.push(async(E,D,H)=>{ /* つまみぐいの共犯 */
    await Promise.all([hmove(D,HSPOT.sneak), hmove(H,HSPOT.sneakH)]);
    hsay(D,'ちょっとだけ……ばう');
    await hp(1100);
    hsay(H,'ちょっとだけ……');
    await hp(1200);
    hsay(E,'こら（笑）。ふたりとも、もうすぐだよ。',{mood:'happy'});
    await hp(1500);
    hmood(D,'happy',1200); hmood(H,'happy',1200);
    await back(D,H);
  });
  if(!quiet) c.push(async(E,D,H)=>{ /* 待ちきれずに、うとうと */
    hsay(D,'いい匂いするばう……');
    await hp(1300);
    D.el.classList.add('sleeping'); hmood(D,'sleepy');
    await hp(1700);
    hsay(H,'しゃだはる、ねてる……。');
    await hp(1300);
    D.el.classList.remove('sleeping'); hmood(D,'normal');
    hsay(D,'はっ、できたばう？');
    await hp(1200);
  });
  if(S.raining) c.push(async(E,D,H)=>{ /* 3人で窓の外をながめる（えりちゃんは台所から） */
    await Promise.all([hmove(D,HSPOT.window), hmove(H,HSPOT.windowH)]);
    hsay(D,season()===3?'まだ、ゆきふってるばう。':'まだ、あめふってるばう。');
    await hp(1400);
    hsay(H,season()===3?'つもるかなあ。':'よくふるなあ。');
    await hp(1300);
    hsay(E,'あしたは晴れるといいね。',{mood:'smile'});
    await hp(1400);
    await back(D,H);
  });
  if(season()===2 && !S.raining) c.push(async(E,D,H)=>{ /* 秋：お月見 */
    await Promise.all([hmove(D,HSPOT.window), hmove(H,HSPOT.windowH)]);
    hsay(H,'月がきれいだね。');
    await hp(1400);
    hsay(D,'まんまるばう。');
    await hp(1300);
    hsay(E,'こんど、お月見だんごも作ろうか。',{mood:'smile'});
    await hp(1500);
    await back(D,H);
  });
  if(season()===1) c.push(async(E,D,H)=>{ /* 夏：せんぷうきの取り合い */
    await hmove(D,HSPOT.appliance);
    hsay(D,'あ〜〜〜ば〜〜う〜〜');
    await hp(1400);
    await hmove(H,HSPOT.applianceH);
    hsay(H,'しゃだはる、ちょっと代わって。');
    await hp(1300);
    hsay(D,'いやばう。');
    await hp(1100);
    hsay(E,'ふふ、ふたりとも子どもみたい。',{mood:'happy'});
    await hp(1400);
    await back(D,H);
  });
  if(season()===3) c.push(async(E,D,H)=>{ /* 冬：ストーブの前で並んで丸くなる */
    await Promise.all([hmove(D,HSPOT.appliance), hmove(H,HSPOT.applianceH)]);
    hmood(D,'sleepy',3200); hmood(H,'sleepy',3200);
    hsay(D,'ぬくぬくばう……');
    await hp(1300);
    hsay(H,'ぬくぬくだなあ……');
    await hp(1400);
    hsay(E,'ごはんできたら呼ぶね。',{mood:'smile'});
    await hp(1300);
    await back(D,H);
  });
  if(S.stones+(S.acorns||0)>0) c.push(async(E,D,H)=>{ /* たからものを、ほまれくんに見せに行く */
    await hmove(D,HSPOT.shelf);
    D.el.querySelector('.carry').innerHTML=icon(S.stones>0?'i-stone':'i-acorn');
    D.el.classList.add('carrying');
    await hmove(D,{x:HSPOT.tableHomare.x+6,y:HSPOT.tableHomare.y+84});
    hsay(D,'これ、見つけたばう！');
    await hp(1400);
    hmood(H,'happy',2000);
    hsay(H,'すごいな！しゃだはるが見つけたの？');
    await hp(1500);
    hmood(D,'happy',1600); hmood(E,'smile',1600);
    hsay(D,'えっへんばう。');
    await hp(1200);
    D.el.classList.remove('carrying');
    await hmove(D,HSPOT.tableShada);
  });
  if(!quiet) c.push(async(E,D,H)=>{ /* お皿を運ぼうとして、ふらふら */
    await hmove(D,HSPOT.counterEnd);
    D.el.querySelector('.carry').innerHTML='<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="25" rx="17" ry="6" fill="#fffdf8" stroke="#cfc6b9" stroke-width="2"/><ellipse cx="20" cy="24" rx="10" ry="3" fill="#f1e9da"/></svg>';
    D.el.classList.add('carrying');
    hsay(D,'しゃだはるのお皿、はこぶばう！');
    await hp(1300);
    if(!reduceMotion&&!homeSkip) D.el.classList.add('wobble');
    hsay(D,'ふら、ふら……ばう');
    await hmove(D,{x:HSPOT.tableShada.x-6,y:HSPOT.tableShada.y+86},{slide:true,ms:1700});
    D.el.classList.remove('wobble');
    hsay(H,'おっとっと。ありがとう、しゃだはる。');
    await hp(1400);
    D.el.classList.remove('carrying');
    hmood(D,'happy',1800); hmood(E,'smile',1800);
    hsay(D,'はこべたばう！');
    await hp(1200);
    await hmove(D,HSPOT.tableShada);
  });
  if(S.stones+(S.acorns||0)>0) c.push(async(E,D,H)=>{ /* 見つけたたからものを、ながめる */
    await hmove(D,HSPOT.shelf);
    hsay(D,'たからもの、きょうもきれいばう。');
    await hp(1600);
    hsay(E,'ぜんぶ、しゃだはるが見つけたんだよね。',{mood:'smile'});
    await hp(1500);
    await hmove(D,HSPOT.tableShada);
  });
  c.push(async(E,D,H)=>{ /* ほまれくんに、なでてもらう */
    hsay(H,'しゃだはる、おいで。');
    await hp(1000);
    await hmove(D,{x:HSPOT.tableHomare.x+40,y:HSPOT.tableHomare.y+88});
    await hmove(H,{x:HSPOT.tableHomare.x-8,y:HSPOT.tableHomare.y+80});
    hsay(H,'よしよし。');
    hfx('i-heart',{x:D.x,y:D.y-30});
    hmood(D,'happy',2200); hmood(E,'smile',2400);
    await hp(1100);
    hsay(D,'ばう♪');
    await hp(1300);
    await back(D,H);
  });
  return pick(c);
}

function watchable(){
  return growingPlots().filter(i=>{ const p=S.plots[i], remain=totalOf(p)-p.growth; return p.watered && remain>=60 && remain<=Math.min(300,DAY_END-S.clock-30); });
}
async function maybeEvent(resting,forceId){
  if(A.shada.mode!=='follow') return false;
  let e=null;
  if(forceId){ e=EVENTS.find(x=>x.id===forceId); if(!e||!e.can()) return false; }
  else{
    const max={helpful:3,goofy:3,sleepy:2}[S.mood]||3;
    if(S.eventsToday>=max || S.sinceEvent<3 || S.clock>=DAY_END) return false;
    if(rnd()>(resting?.55:.22)) return false;
    const c=EVENTS.filter(x=>x.can()); if(!c.length) return false;
    const wt=x=>(x.w[S.mood]||1)*(x.k?x.k():1);   /* k＝季節による出やすさ */
    let sum=0; c.forEach(x=>sum+=wt(x));
    let r=rnd()*sum; e=c[c.length-1];
    for(const x of c){ r-=wt(x); if(r<=0){ e=x; break; } }
  }
  S.eventsToday+=1; S.sinceEvent=0;
  await pause(350);
  peekStart();
  await e.run();
  peekUpdate();
  await pause(800);
  peekEnd();
  return true;
}

async function nextMorning(){
  const prevSeason=season();
  let droopy=null;
  S.plots.forEach((p,i)=>{
    if(p.crop && !isRipe(p)){
      if(p.watered) p.growth=Math.min(totalOf(p),p.growth+NIGHT_BONUS);
      else { p.dry=true; if(droopy==null) droopy=i; }
    }
    if(p.soggy){ p.soggy=false; if(p.unlocked) p.frog=true; } else p.frog=false;
    p.watered=false; p.bug=false; p.frost=false;
  });
  const sp=S.shadaPlot;
  if(sp.phase==='grow'){ sp.growth=Math.min(720,sp.growth+NIGHT_BONUS); if(sp.growth>=720) sp.phase='ripe'; }
  Object.keys(S.pantry).forEach(k=>{ S.pantry[k]-=1; if(S.pantry[k]<=0) delete S.pantry[k]; });
  S.day+=1; S.clock=DAY_START; S.today={}; S.newToday=[]; S.basketToday=[]; S.eventsToday=0; S.sinceEvent=1; S.petsToday=0; S.raining=false;
  S.windy=false; S.rainbow=false; S.frostJoy=false; wxQueue=[];
  S.fridge=rollFridge(S.fridge);
  rollWeather();
  if(season()!==3) S.snowCover=false;
  else if(rnd()<.8) placeFrost();
  const m=rnd(); S.mood=m<.35?'helpful':m<.75?'goofy':'sleepy';
  let sprouted=false;
  if(sp.phase==='pending' && S.day>=sp.appearDay){
    sp.phase='grow'; sp.growth=120; sprouted=true;
    if(!CROPS[sp.crop] || CROPS[sp.crop].season!==season()){ const inS=Object.keys(CROPS).filter(k=>CROPS[k].season===season()); sp.crop=pick(inS); }
  }
  const changed=season()!==prevSeason;
  if(changed) S.held=null;
  let melted=false;
  if(season()!==3 && S.snowman){ S.snowman=false; melted=true; }
  await morning({droopy,sprouted,changed,melted,frogs:S.plots.some(p=>p.frog)});
}
/* きょうの天気を決める。春＝そよ風か雨、夏＝午後の夕立（雷）、秋＝落ち葉の風か雨、冬＝雪。時間帯つき */
function rollWeather(){
  const sn=season(), r=rnd(), half=n=>Math.floor(rnd()*n)*30;
  let w=null;
  if(sn===1){ if(r<.4){ const from=780+half(5); w={kind:'storm',from,to:Math.min(DAY_END,from+120+half(3))}; } }
  else if(sn===3){ if(r<.5){ const from=540+half(7); w={kind:'snow',from,to:rnd()<.35?DAY_END+60:from+180+half(5)}; } }
  else if(r<.22){ const from=540+half(8); w={kind:'rain',from,to:rnd()<.3?DAY_END+60:from+120+half(5)}; }
  else if(r<.72){ const from=450+half(10); w={kind:sn===0?'breeze':'leaves',from,to:from+120+half(3)}; }
  S.wx=w;
  S.weather=(w&&isWet(w.kind))?'rain':'sun';
  S.rainAt=w?w.from:0;
}
/* 冬の朝：畑の1〜3マスに霜がおりる（温室と、もう実っているマスはのぞく） */
function placeFrost(){
  const c=S.plots.map((p,i)=>i).filter(i=>{ const p=S.plots[i]; return !isGH(i) && p.unlocked && p.tilled && !(p.crop&&isRipe(p)); });
  const n=Math.min(c.length,1+Math.floor(rnd()*3));
  for(let k=0;k<n;k++){ const j=Math.floor(rnd()*c.length); S.plots[c[j]].frost=true; c.splice(j,1); }
}

  html+='<p class="sub">レシピ（'+rec.length+'／'+RECIPES.length+'）</p><ul>'+(rec.length?rec.map(r=>'<li>'+esc(r.name)+'</li>').join(''):'<li>収穫した日の夕ごはんで、ふえていきます。</li>')+'</ul>';
  const row=(id,n,max)=>{ let h=''; for(let k=0;k<Math.min(n,max);k++) h+='<svg style="width:20px;height:20px'+(id==='i-stone'?';filter:hue-rotate('+((k*67)%360)+'deg)':'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; return h+(n>max?' ほか':''); };
  html+='<p class="sub">ふたりの記録</p><div class="tally"><span>'+icon('i-heart')+'なごみ度 '+S.nagomi+'</span></div>';
  html+='<p style="margin:2px 0">きれいな石 '+S.stones+'こ　'+row('i-stone',S.stones,15)+'</p>';
  html+='<p style="margin:2px 0">どんぐり '+(S.acorns||0)+'こ　'+row('i-acorn',S.acorns||0,15)+'</p>';
  html+='<p style="margin:2px 0">出会ったカエル '+S.frogs+'ひき　'+row('i-frog',S.frogs,10)+'</p>';
  const got=UNLOCKS.filter(u=>S.unlocked[u.key]).map(u=>u.name);
  html+='<p class="sub">できたもの：'+(got.length?got.map(esc).join('、'):'まだありません')+'</p>';
  const dgot=DECOR.filter(d=>S.decor&&S.decor[d.key]).map(d=>d.name), dnext=DECOR.find(d=>!(S.decor&&S.decor[d.key]));
  html+='<p class="sub">おうちにふえたもの：'+(dgot.length?dgot.map(esc).join('、'):'まだありません')+(dnext?'（なごみ度 '+dnext.at+' で、なにかふえます）':'')+'</p>';
  if(S.request && CROPS[S.request.crop]) html+='<p class="sub">ほまれくんのリクエスト：'+esc(CROPS[S.request.crop].name)+'</p>';
  if(fridgeOK(S.fridge)) html+='<p class="sub">きょうの冷蔵庫：'+S.fridge.map(k=>esc(FRIDGE[k].name)).join('、')+'（ほまれくんが買っておいてくれます）</p>';
  html+='<p class="sub">セーブ：'+(saveOK===false?'このページでは保存できないようです。閉じると最初からになります。':'行動のたびに、自動で保存されます。')+'</p>';
  html+='<p class="sub">セーブの引き継ぎ（新しい版のファイルに替えるとき用）</p><div class="xfer"><textarea id="xferBox" readonly aria-label="セーブデータ"></textarea><div class="msg" id="xferMsg">「コピー」した文字を、新しい版の「読みこむ」に貼りつけます。</div><div class="rowEnd" style="margin-top:4px"><button class="btn small" type="button" id="xferCopy">コピー</button><button class="btn small" type="button" id="xferLoad">読みこむ…</button></div></div>';
  html+='<div class="rowEnd"><button class="btn small" type="button" id="resetBtn">最初からやりなおす</button><button class="btn primary" type="button" data-close>とじる</button></div>';
  openSheet(html,{center:true,kind:'diary'});
  const box=$('#xferBox'), msg=$('#xferMsg'); let loading=false;
  box.value=exportSave();
  $('#xferCopy').addEventListener('click',async()=>{
    if(loading){ loading=false; box.readOnly=true; box.value=exportSave(); }
    let ok=false;
    try{ await navigator.clipboard.writeText(box.value); ok=true; }catch(e){}
    if(!ok){ try{ box.focus(); box.select(); ok=document.execCommand('copy'); }catch(e){} }
    msg.textContent=ok?'コピーしました。':'自動でコピーできませんでした。上の文字を長押しして、ぜんぶ選んでコピーしてください。';
  });
  $('#xferLoad').addEventListener('click',async()=>{
    if(!loading){ loading=true; box.readOnly=false; box.value=''; box.placeholder='ここに貼りつけて、もう一度「読みこむ…」'; try{ box.focus(); }catch(e){} msg.textContent='いまのデータは上書きされます。'; return; }
    const data=importSave(box.value);
    if(!data){ msg.textContent='読みこめませんでした。コピーした文字をそのまま貼りつけてください。'; return; }
    closeSheet(); cancelErrand(); hush();
    S=Object.assign(newGame(),normalize(data)); S.plots.forEach(p=>{ p.bug=false; }); fixup(); queued=null;
    await saveNow(); await welcomeBack();
  });
  const rb=$('#resetBtn'); let armed=false;
  rb.addEventListener('click',async()=>{
    if(!armed){ armed=true; rb.textContent='ほんとうに消す？（もう一度タップ）'; return; }
    closeSheet(); cancelErrand(); hush(); await Store.clear(); S=newGame(); queued=null; renderAll(); await intro();
  });
}

function exportSave(){
  const d=Object.assign({},S,{log:S.log.slice(-5)});
  try{ return 'HATAKE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }catch(e){ return ''; }
}
function importSave(text){
  try{
    const t=String(text||'').replace(/\s+/g,'');
    if(t.indexOf('HATAKE1:')!==0) return null;
    const d=JSON.parse(decodeURIComponent(escape(atob(t.slice(8)))));
    if(!d || d.v!==1 || !Array.isArray(d.plots) || d.plots.length!==14 || typeof d.day!=='number') return null;
    return d;
  }catch(e){ return null; }
}

async function boot(){
  buildPlots();
  let data=null;
  try{ data=await Promise.race([Store.load(), sleep(2500).then(()=>null)]); }catch(e){}
  if(data && data.v===1 && Array.isArray(data.plots) && data.plots.length===14){
    S=Object.assign(newGame(),normalize(data));
    S.plots.forEach(p=>{ p.bug=false; });
    fixup();
  }else S=newGame();
  Snd.refreshBtn();
  if(!S.intro) await intro(); else await welcomeBack();
}
