  if(S.mood==='sleepy'){ setMood('shada','sleepy',2000); say('shada','ふわぁ……がんばるばう。'); }
  else{ setMood('shada','happy',1600); say('shada',pick(LINES.morningReply)); }
  if(info.sprouted){
    await pause(1500);
    await moveShada({x:SPOT.shadaPlot.x+30,y:SPOT.shadaPlot.y-22});
    say('shada','ここにも生えたばう？');
    log('畑のはしっこから、ひょっこり芽が出ています。だれかが種を落としたみたい。');
  }else if(info.frogs){
    await pause(600);
    log('びしょびしょだった畑に、カエルが遊びに来ています。');
  }
  if(S.plots.some(p=>p.frost)){
    await pause(1500);
    say('shada',pickV(['つち、こおってるばう。','つち、かちかちばう。']));
    log('畑に霜がおりています。こおったマスは、朝9時ごろにとけます。タップすると、霜柱をふんでとかせます。');
  }
  /* くだもの（v1.21.0）：木になった朝と、実がなった朝は、しゃだはる君が気づいて教える（依頼者の希望） */
  if(info.treeGrown){ await pause(1500); setMood('shada','happy',1600); say('shada',FRUITS.nashi.grownS); log('梨の苗木が、りっぱな木になりました。秋になると、実がなります。'); }
  if(info.vineGrown) log(FRUITS.budou.grownLog);
  if(info.fruit){
    const f=FRUITS[info.fruit];
    await pause(1500); setMood('shada','happy',1600); say('shada',f.noticeS);
    await pause(1500); say('eri',f.noticeE,0,'happy'); log(f.noticeLog);
  }
  if(info.basil){   /* v1.23.0：バジルがつめる朝も、しゃだはる君が気づく */
    await pause(1500); setMood('shada','happy',1600); say('shada','えりちゃん、バジル、そだったばう！');
    await pause(1500); say('eri','ほんとだ。あとで、つんでおこうね。',0,'happy'); log('温室のバジルが育っています。タップして、つみましょう。');
  }
  await pause(400);
  busy=false; renderButtons(); saveSoon(); runQueued();
}

let sheetLocked=false, sheetReturn=null, sheetKind=null;
const sheetHead=title=>'<div class="cardHead"><h2>'+esc(title)+'</h2><button class="btn closeX" type="button" data-close><span aria-hidden="true">✕</span>とじる</button></div>';
function openSheet(html,opt){
  opt=opt||{};
  modal=true; sheetLocked=!!opt.locked; sheetReturn=document.activeElement;
  sheetCard.innerHTML=html; fillMinis(sheetCard);
  sheetCard.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheet));
  sheetKind=opt.kind||null;
  diaryBtn.textContent=sheetKind==='diary'?'にっきをとじる':'にっき';
  sheet.className='sheet on'+(opt.center?' center':'')+(opt.night?' night':'');
  sheetCard.scrollTop=0;
  const f=sheetCard.querySelector('button'); if(f) try{ f.focus({preventScroll:true}); }catch(e){}
}
function closeSheet(){
  modal=false; sheetLocked=false; sheetKind=null; sheet.className='sheet'; sheetCard.innerHTML='';
  diaryBtn.textContent='にっき';
  if(sheetReturn && sheetReturn.focus) try{ sheetReturn.focus({preventScroll:true}); }catch(e){}
}
sheet.addEventListener('click',e=>{ if(e.target===sheet && !sheetLocked) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && modal && !sheetLocked) closeSheet(); });

function openSeeds(i){
  if(busy) return;
  const gh=i!=null && isGH(i);
  const keys=Object.keys(CROPS).filter(k=>gh || CROPS[k].season===season());
  let html=sheetHead('どの種をまく？')+'<p class="sub">'+(gh?'温室は、どの季節の種でも育ちます。':SEASONS[season()]+'にまける種です。えらんだ種は持ったままになり、あいたマスをタップするだけで続けてまけます。')+'</p><div class="seeds">';
  keys.forEach(k=>{
    const c=CROPS[k];
    html+='<button class="seed'+(S.lastSeed===k?' last':'')+'" type="button" data-seed="'+k+'">'+icon('c-'+k)+'<span><b>'+esc(c.name)+'</b><span>'+(gh?SEASONS[c.season]+'の野菜・'+SPEED[c.speed].short:SPEED[c.speed].label)+'</span></span></button>';
  });
  html+='</div>';
  openSheet(html,{kind:'seeds'});
  sheetCard.querySelectorAll('[data-seed]').forEach(b=>b.addEventListener('click',()=>{ Snd.play('pick');
    const k=b.dataset.seed;
    if(!gh) S.held=k;
    closeSheet(); renderHeld();
    if(i!=null && S.plots[i] && S.plots[i].tilled && !S.plots[i].crop && allowedSeed(k,i)) playerAction('plant',i,k);
  }));
}
function openDiary(){
  if(busy) return;
  const rec=RECIPES.filter(r=>S.recipes[r.name]);

  let html=sheetHead('にっき');
  html+='<p class="sub">'+(yearNo()>1?yearNo()+'年目 ':'')+SEASONS[season()]+'・'+seasonDay()+'日目のできごと</p><ul>'+(todays.length?todays.map(l=>'<li>'+clockStr(l.t)+'　'+esc(l.text)+'</li>').join(''):'<li>まだなにもありません。</li>')+'</ul>';
  html+='<p class="sub">これまでの収穫（ぜんぶで'+S.total+'こ）</p>'+tallyHTML(S.totals,true);
  html+='<p class="sub">レシピ（'+rec.length+'／'+RECIPES.length+'）</p><ul>'+(rec.length?rec.map(r=>'<li>'+esc(r.name)+'</li>').join(''):'<li>収穫した日の夕ごはんで、ふえていきます。</li>')+'</ul>';
  const row=(id,n,max)=>{ let h=''; for(let k=0;k<Math.min(n,max);k++) h+='<svg style="width:20px;height:20px'+(id==='i-stone'?';filter:hue-rotate('+((k*67)%360)+'deg)':'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; return h+(n>max?' ほか':''); };
  html+='<p class="sub">ふたりの記録</p><div class="tally"><span>'+icon('i-heart')+'なごみ度 '+S.nagomi+'</span></div>';
  html+='<p style="margin:2px 0">きれいな石 '+S.stones+'こ'+(boxed('stone')?'（たからばこに '+boxed('stone')+'こ）':'')+'　'+row('i-stone',S.stones,15)+'</p>';
  html+='<p style="margin:2px 0">どんぐり '+(S.acorns||0)+'こ'+(boxed('acorn')?'（たからばこに '+boxed('acorn')+'こ）':'')+'　'+row('i-acorn',S.acorns||0,15)+'</p>';
  if(S.harvHist && S.harvHist.length) html+='<p style="margin:2px 0">このごろの収穫：'+S.harvHist.join('こ・')+'こ（1日ずつ）</p>';
  if(S.fruitN && (S.fruitN.nashi||S.fruitN.budou)) html+='<p style="margin:2px 0">くだもののデザート：梨 '+(S.fruitN.nashi||0)+'回・ぶどう '+(S.fruitN.budou||0)+'回</p>';
  html+='<p style="margin:2px 0">出会ったカエル '+S.frogs+'ひき　'+row('i-frog',S.frogs,10)+'</p>';
  html+='<p style="margin:2px 0">おじさんのおすそわけ '+(S.gifts||0)+'回'+((S.giftToday||[]).length?'（きょう：'+S.giftToday.map(vegName).map(esc).join('、')+'）':'')+'</p>';
  const got=UNLOCKS.filter(u=>S.unlocked[u.key]).map(u=>u.name);
  html+='<p class="sub">できたもの：'+(got.length?got.map(esc).join('、'):'まだありません')+'</p>';
  const dgot=DECOR.filter(d=>S.decor&&S.decor[d.key]).map(d=>d.name), dnext=nextReward();
  html+='<p class="sub">おうちにふえたもの：'+(dgot.length?dgot.map(esc).join('、'):'まだありません')+(dnext?'（なごみ度 '+S.rewardAt[dnext.key]+' で、つぎの ごほうび）':'')+'</p>';
  if(S.request && CROPS[S.request.crop]) html+='<p class="sub">ほまれくんのリクエスト：'+esc(CROPS[S.request.crop].name)+'</p>';
  if(fridgeOK(S.fridge)) html+='<p class="sub">きょうの冷蔵庫：'+S.fridge.map(k=>esc(FRIDGE[k].name)).join('、')+'（ほまれくんが買っておいてくれます）</p>';
  html+='<p class="sub">セーブ：'+(saveOK===false?'このページでは保存できないようです。閉じると最初からになります。':'行動のたびに、自動で保存されます。')+'</p>';
  html+='<p class="sub">セーブの引き継ぎ（新しい版のファイルに替えるとき用）</p><div class="xfer"><textarea id="xferBox" readonly aria-label="セーブデータ"></textarea><div class="msg" id="xferMsg">「コピー」した文字を、新しい版の「読みこむ」に貼りつけます。</div><div class="rowEnd" style="margin-top:4px"><button class="btn small" type="button" id="xferCopy">コピー</button><button class="btn small" type="button" id="xferLoad">読みこむ…</button></div></div>';
  html+='<div class="rowEnd"><button class="btn small" type="button" id="resetBtn">最初からやりなおす</button><button class="btn primary" type="button" data-close>とじる</button></div>';
  openSheet(html,{center:true,kind:'diary'});
  const box=$('#xferBox'), msg=$('#xferMsg'); let loading=false;
  box.value=exportSave();
  $('#xferCopy').addEventListener('click',async()=>{
    if(loading){ loading=false; box.readOnly=true; box.value=exportSave(); }
    let ok=false;
    try{ await navigator.clipboard.writeText(box.value); ok=true; }catch(e){}
    if(!ok){ try{ box.focus(); box.select(); ok=document.execCommand('copy'); }catch(e){} }
    msg.textContent=ok?'コピーしました。':'自動でコピーできませんでした。上の文字を長押しして、ぜんぶ選んでコピーしてください。';
  });
  $('#xferLoad').addEventListener('click',async()=>{
    if(!loading){ loading=true; box.readOnly=false; box.value=''; box.placeholder='ここに貼りつけて、もう一度「読みこむ…」'; try{ box.focus(); }catch(e){} msg.textContent='いまのデータは上書きされます。'; return; }
    const data=importSave(box.value);
    if(!data){ msg.textContent='読みこめませんでした。コピーした文字をそのまま貼りつけてください。'; return; }
    closeSheet(); cancelErrand(); hush();
    S=Object.assign(newGame(),normalize(data)); S.plots.forEach(p=>{ p.bug=false; }); fixup(); queued=null;
    await saveNow(); await welcomeBack();
  });
  const rb=$('#resetBtn'); let armed=false;
  rb.addEventListener('click',async()=>{
    if(!armed){ armed=true; rb.textContent='ほんとうに消す？（もう一度タップ）'; return; }
    closeSheet(); cancelErrand(); hush(); await Store.clear(); S=newGame(); queued=null; renderAll(); await intro();
  });
}

function exportSave(){
  const d=Object.assign({},S,{log:S.log.slice(-5)});
  try{ return 'HATAKE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }catch(e){ return ''; }
}
function importSave(text){
  try{
    const t=String(text||'').replace(/\s+/g,'');
    if(t.indexOf('HATAKE1:')!==0) return null;
    const d=JSON.parse(decodeURIComponent(escape(atob(t.slice(8)))));
    if(!d || d.v!==1 || !Array.isArray(d.plots) || d.plots.length!==14 || typeof d.day!=='number') return null;
    return d;
  }catch(e){ return null; }
}

async function boot(){
  buildPlots();
  let data=null;
  try{ data=await Promise.race([Store.load(), sleep(2500).then(()=>null)]); }catch(e){}
  if(data && data.v===1 && Array.isArray(data.plots) && data.plots.length===14){
    S=Object.assign(newGame(),normalize(data));

}
